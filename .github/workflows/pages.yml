# SPDX-License-Identifier: GPL-3.0-only
# ALTER en ligne : à chaque envoi sur main ou une branche etape-*, construit la version navigateur (le vrai
# firmware en WebAssembly) et la publie sur GitHub Pages (https://forban5929.github.io/Alter-FM1/ (MAJUSCULES : adresse sensible à la casse)).
# Le dernier envoi gagne : le lien suit toujours l'étape en cours.
name: ALTER en ligne

on:
  push:
    branches: [main, "etape-*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Outils (clang, wasm-ld)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld
          pip install --quiet pillow fonttools numpy
      - name: Construire la version navigateur
        run: sh tools/alter/wasm/build_emu.sh
      - name: Test ALTER
        run: node tools/alter/alter_emu_test.mjs build/emu/felucca.wasm build/emu/alter_play.wav
      - name: Préparer le site
        run: |
          mkdir -p site/fonts
          cp build/emu/index.html build/emu/felucca.wasm build/emu/worklet.js site/
          cp build/emu/fonts/* site/fonts/
          echo "$GITHUB_REF_NAME @ ${GITHUB_SHA::7}" > site/version.txt
      # La page d'installation FM-1 (/install/) : vrai firmware (compilateur JieLi). Si ça échoue, RIEN n'est publié (l'ancien site reste).
      - name: Firmware FM-1 + page d'installation
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          for i in 1 2 3; do git clone -q --depth 1 --filter=blob:none --sparse --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" && break; rm -rf "$HOME/fw-AC79_AIoT_SDK"; sleep 20; done
          (cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone cpu/wl82/tools/uboot.boot \
              cpu/wl82/tools/cfg_tool.bin cpu/wl82/tools/cfg/eq_cfg_hw.bin)
          ./build.sh > build-fw-log.txt 2>&1 || { tail -40 build-fw-log.txt; exit 1; }
          python3 tools/alter/make_install.py build/felucca.fwsc "$GITHUB_REF_NAME-${GITHUB_SHA::7}" site/install
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
