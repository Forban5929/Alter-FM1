# SPDX-License-Identifier: GPL-3.0-only
# ALTER en ligne : à chaque envoi sur main ou une branche etape-*, construit la version navigateur (le vrai
# firmware en WebAssembly) et la publie sur GitHub Pages (https://forban5929.github.io/Alter-FM1/ (MAJUSCULES : adresse sensible à la casse)).
# Le dernier envoi gagne : le lien suit toujours l'étape en cours.
name: ALTER en ligne

on:
  push:
    branches: [main, "etape-*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # L'outil de secours Windows (mode UBOOT) : fm1_recover de Melodee, adapté (tools/alter/rescue), en un seul .exe
  rescue:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire alter-fm1-secours.exe
        shell: bash
        run: |
          pip install --quiet pyinstaller pyusb libusb-package
          DLL="$(python -c "import libusb_package,os;print(os.path.join(os.path.dirname(libusb_package.__file__),'libusb-1.0.dll'))")"
          ls -l "$DLL"
          cd tools/alter/rescue
          pyinstaller --onefile --name alter-fm1-secours --paths . --add-data "wl82loader.bin;." --add-binary "$DLL;." fm1_recover.py
          ./dist/alter-fm1-secours.exe --version
          ./dist/alter-fm1-secours.exe --info --wait 0 || true
          mkdir -p pack && cp dist/alter-fm1-secours.exe 1-VERIFIER.bat 2-SAUVEGARDER.bat 3-ECRIRE-V15.bat LISEZMOI.txt wl82loader-README.md pack/
          cp ../../../LICENSE pack/LICENSE-GPL-3.0.txt
          cd pack && 7z a ../alter-fm1-secours-windows.zip . > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: rescue
          path: tools/alter/rescue/alter-fm1-secours-windows.zip

  build:
    needs: rescue
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Outils (clang, wasm-ld)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld
          pip install --quiet pillow fonttools numpy
      - name: Construire la version navigateur
        run: sh tools/alter/wasm/build_emu.sh
      - name: Test ALTER
        run: node tools/alter/alter_emu_test.mjs build/emu/felucca.wasm build/emu/alter_play.wav
      - name: Préparer le site
        run: |
          mkdir -p site/fonts
          cp build/emu/index.html build/emu/felucca.wasm build/emu/worklet.js site/
          cp build/emu/fonts/* site/fonts/
          echo "$GITHUB_REF_NAME @ ${GITHUB_SHA::7}" > site/version.txt
      # La page d'installation FM-1 (/install/) : vrai firmware (compilateur JieLi). Si ça échoue, RIEN n'est publié (l'ancien site reste).
      - name: Firmware FM-1 + page d'installation
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          for i in 1 2 3; do git clone -q --depth 1 --filter=blob:none --sparse --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" && break; rm -rf "$HOME/fw-AC79_AIoT_SDK"; sleep 20; done
          (cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone cpu/wl82/tools/uboot.boot \
              cpu/wl82/tools/cfg_tool.bin cpu/wl82/tools/cfg/eq_cfg_hw.bin)
          ./build.sh > build-fw-log.txt 2>&1 || { tail -40 build-fw-log.txt; exit 1; }
          python3 tools/alter/make_install.py build/felucca.fwsc "$GITHUB_REF_NAME-${GITHUB_SHA::7}" site/install
      - uses: actions/download-artifact@v4
        with:
          name: rescue
          path: site/secours
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
