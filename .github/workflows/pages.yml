# SPDX-License-Identifier: GPL-3.0-only
# ALTER en ligne (https://forban5929.github.io/Alter-FM1/ (MAJUSCULES : adresse sensible à la casse)).
# Depuis la v1.1 (22/11, choix de Romain) : DEUX sites dans une seule publication GitHub Pages :
#   - racine  = la DERNIÈRE RELEASE (tag vX.YY) : ce que voient les gens, ne change qu'à une Release ;
#   - /beta/  = la branche de travail etape-3d, à chaque envoi, bandeau rouge « BETA ».
# Relancé par firmware.yml après chaque Release (workflow_dispatch) pour mettre la racine à jour.
name: ALTER en ligne

on:
  push:
    branches: ["etape-*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-2  # (11/11: the old group holds ghost runs GitHub cannot cancel)
  cancel-in-progress: true

jobs:
  # L'outil de secours Windows (mode UBOOT) : fm1_recover de Melodee, adapté (tools/alter/rescue), en un seul .exe
  rescue:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire alter-fm1-secours.exe
        shell: bash
        run: |
          pip install --quiet pyinstaller pyusb libusb-package
          DLL="$(python -c "import libusb_package,os;print(os.path.join(os.path.dirname(libusb_package.__file__),'libusb-1.0.dll'))")"
          ls -l "$DLL"
          cd tools/alter/rescue
          pyinstaller --onefile --name alter-fm1-secours --paths . --add-data "wl82loader.bin;." --add-binary "$DLL;." fm1_recover.py
          ./dist/alter-fm1-secours.exe --version
          ./dist/alter-fm1-secours.exe --info --wait 0 || true
          mkdir -p pack && cp dist/alter-fm1-secours.exe 1-VERIFIER.bat 2-SAUVEGARDER.bat 3-ECRIRE-ALTER.bat LISEZMOI.txt wl82loader-README.md pack/
          cp ../../../LICENSE pack/LICENSE-GPL-3.0.txt
          cd pack && 7z a ../alter-fm1-secours-windows.zip . > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: rescue
          path: tools/alter/rescue/alter-fm1-secours-windows.zip

  build:
    needs: rescue
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: etape-3d
          submodules: true
          fetch-depth: 0          # les tags, pour trouver la dernière Release
          path: beta-src
      - name: Dernière Release (tag vX.YY)
        id: rel
        run: |
          cd beta-src
          T=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "tag=$T" >> "$GITHUB_OUTPUT"; echo "Release publique : $T"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}
          submodules: true
          path: pub-src
      - name: Outils (clang, wasm-ld)
        run: |
          # (11/11: Ubuntu's mirror down) the runner's own clang / wasm-ld first; apt only if missing, 3 tries
          if ! command -v wasm-ld >/dev/null; then
            for v in 18 17 16 19; do [ -x /usr/bin/wasm-ld-$v ] && sudo ln -sf /usr/bin/wasm-ld-$v /usr/local/bin/wasm-ld && break; done
            [ -x /usr/lib/llvm-18/bin/wasm-ld ] && ! command -v wasm-ld >/dev/null && sudo ln -sf /usr/lib/llvm-18/bin/wasm-ld /usr/local/bin/wasm-ld || true
          fi
          if ! command -v clang >/dev/null || ! command -v wasm-ld >/dev/null; then
            for t in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq clang lld && break; sleep 20; done
          fi
          clang --version | head -1; wasm-ld --version
          pip install --quiet pillow fonttools numpy
      - name: Compilateur + SDK JieLi
        run: |
          sh beta-src/tools/get_toolchain.sh "$HOME/.jieli"
          for i in 1 2 3; do git clone -q --depth 1 --filter=blob:none --sparse --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" && break; rm -rf "$HOME/fw-AC79_AIoT_SDK"; sleep 20; done
          (cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone cpu/wl82/tools/uboot.boot \
              cpu/wl82/tools/cfg_tool.bin cpu/wl82/tools/cfg/eq_cfg_hw.bin)
      - uses: actions/download-artifact@v4
        with:
          name: rescue
          path: rescue
      # Si l'un des deux échoue, RIEN n'est publié (l'ancien site reste en ligne).
      - name: Site public (dernière Release)
        run: sh beta-src/tools/alter/site_build.sh pub-src site public "${{ steps.rel.outputs.tag }}" rescue/alter-fm1-secours-windows.zip
      - name: Site BETA (etape-3d)
        env:
          ALTER_OLD_WASM: ${{ github.workspace }}/pub-src/build/emu/felucca.wasm
        run: sh beta-src/tools/alter/site_build.sh beta-src site/beta beta etape-3d rescue/alter-fm1-secours-windows.zip
      - name: Résumé
        run: |
          echo "public : $(cat site/version.txt)"; echo "beta   : $(cat site/beta/version.txt)"
          echo "### Public : $(cat site/version.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "### BETA : $(cat site/beta/version.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
