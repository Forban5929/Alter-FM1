# SPDX-License-Identifier: GPL-3.0-only
# ALTER pour la vraie FM-1 : construit le firmware (felucca.fwsc) avec le compilateur JieLi, introuvable dans le
# cloud de Claude. Le fichier se télécharge dans l'onglet Actions (section « Artifacts » du run).
name: Firmware FM-1

on:
  push:
    branches: [main, "etape-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Outils Python
        run: pip install --quiet pillow fonttools numpy
      - name: Compilateur JieLi (pi32v2)
        run: sh tools/get_toolchain.sh "$HOME/.jieli"
      - name: SDK JieLi AC79 (3 fichiers utilisés)
        run: |
          for i in 1 2 3; do git clone -q --depth 1 --filter=blob:none --sparse --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" && break; rm -rf "$HOME/fw-AC79_AIoT_SDK"; sleep 20; done
          cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone \
              cpu/wl82/tools/uboot.boot cpu/wl82/tools/cfg_tool.bin cpu/wl82/tools/cfg/eq_cfg_hw.bin
          ls -l cpu/wl82/tools/uboot.boot cpu/wl82/tools/cfg_tool.bin cpu/wl82/tools/cfg/eq_cfg_hw.bin
      - name: Construire
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build-log.txt
      - name: Contrôle par l'outil de secours (paquet accepté ?)
        if: always()
        run: python3 tools/alter/rescue/fm1_recover.py build/felucca.fwsc --check --loader tools/alter/rescue/wl82loader.bin
      - name: Test 2 cœurs (son identique, aucun accès simultané)
        run: |
          mkdir -p build/host
          cc -std=gnu99 -O1 -g -w -fsanitize=thread -DFELUCCA_CPU2=1 -Ibuild/gen -Ifirmware/src -Ifirmware/hal -Itests \
              -Ifirmware/bsp/chip -Ifirmware/bsp/boards/fm1 tests/dualcore_test.c -o build/host/dualcore_test -lpthread -lm
          TSAN_OPTIONS="halt_on_error=1 report_signal_unsafe=0" build/host/dualcore_test | tail -3
      - name: Tailles
        if: always()
        run: |
          ls -l build/*.bin build/*.fwsc build/loader/*.bin 2>/dev/null | tee -a build-log.txt
          SZ="$(ls "$HOME"/.jieli/toolchain/pi32v2/bin/ | grep -m1 -E 'size$' || true)"
          [ -n "$SZ" ] && [ -f build/felucca.elf ] && "$HOME/.jieli/toolchain/pi32v2/bin/$SZ" -A build/felucca.elf | tee -a build-log.txt || true
          echo "Place pour le code (XIP, app.ld) : $((0x8DFBC)) octets" | tee -a build-log.txt
          [ -f build/felucca.dis ] && awk '/^[A-Za-z_.][^ ]*:$/{fn=$1} /: ff[cd][0-9a-f]{5} >/{print "ROM? dans " fn; n=10} n>0{print; n--}' build/felucca.dis | head -40 || true
      - name: Pile du 2e cœur
        if: always()
        run: '[ -f build/felucca.dis ] && python3 tools/alter/stack_c1.py build/felucca.dis || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alter-fm1-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            build/felucca.fwsc
            build/felucca.bin
            build/felucca.dis
            build-log.txt
          if-no-files-found: warn
      - name: Essai de construction « release » (identité FM-1_900 gardée, accepté par la page d'installation)
        run: |
          ./build.sh --release 1.0-ci | tail -4
          python3 -c "import re,sys;r=open('build/alter-1.0-ci.fwsc','rb').read();a=open('build/felucca.bin','rb').read();m=re.search(rb'FM-1_\d{3}',r);print('identite',m and m.group(0),'version',b'v1.0-ci' in a);sys.exit(0 if m and m.group(0)==b'FM-1_900' and b'v1.0-ci' in a else 1)"
          python3 tools/alter/make_install.py build/alter-1.0-ci.fwsc v1.0-ci /tmp/install-ci | tail -1
          ls build/release-1.0-ci build/release-1.0-ci/LICENSES
      - name: Désassemblage de fonctions chaudes (pour le profil CPU, lu depuis le journal)
        if: always()
        run: |
          [ -f build/felucca.dis ] || exit 0
          for f in afl_side afl_stage afl_coef alt_render rev_hall tsvf_lp __divdi3 alt_udivmod64; do
            awk -v F="$f" '/^[0-9a-f]+ <[^>]+>:$/{p=($2=="<"F">:")} p' build/felucca.dis > /tmp/fn.txt
            echo "== $f : $(grep -c ':	' /tmp/fn.txt) instructions"
            [ "$f" = afl_side ] || [ "$f" = afl_stage ] && cat /tmp/fn.txt | head -400
          done
